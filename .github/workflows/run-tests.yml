name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            node-version: 20
            display-name: node 20
            test-cmd: pnpm exec vitest run --coverage
          - runtime: node
            node-version: 22
            display-name: node 22
            test-cmd: pnpm exec vitest run --coverage
          - runtime: node
            node-version: 24
            display-name: node 24
            test-cmd: pnpm exec vitest run --coverage
          - runtime: node
            node-version: 26
            display-name: node 26
            test-cmd: pnpm exec vitest run --coverage
          - runtime: deno
            node-version: 22
            display-name: deno
            test-cmd: deno run -A npm:vitest run
          - runtime: bun
            node-version: 22
            display-name: bun
            test-cmd: bunx vitest run
          - runtime: cloudflare-workers
            node-version: 22
            display-name: cloudflare-workers
            test-cmd: pnpm exec vitest run --config vitest.config.workers.mts
          - runtime: vercel-edge
            node-version: 22
            display-name: vercel-edge
            test-cmd: pnpm exec vitest run --config vitest.config.edge.ts

    name: Test (${{ matrix.display-name }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm

    - name: Setup Deno
      if: matrix.runtime == 'deno'
      uses: denoland/setup-deno@v2

    - name: Setup Bun
      if: matrix.runtime == 'bun'
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: ${{ matrix.test-cmd }}

    - name: Run type checks
      if: matrix.runtime == 'node' && matrix.node-version == 22
      run: pnpm run typecheck

    - name: Upload coverage to Codecov
      if: matrix.runtime == 'node'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: node-${{ matrix.node-version }}

    - name: Rename coverage file
      if: matrix.runtime == 'node'
      run: mv ./coverage/lcov.info ./coverage/lcov-${{ matrix.node-version }}.info

    - name: Upload coverage artifacts
      if: matrix.runtime == 'node'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-node-${{ matrix.node-version }}
        path: ./coverage

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./test-results.xml
